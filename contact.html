
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Playtech Studio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
    }

    .container {
      max-width: 480px;
      width: 100%;
      padding: 35px;
      text-align: center;
      background: #151d32;
      border: 1px solid #293650;
      border-radius: 18px;
    }

    h1 {
      color: #55c7ff;
    }

    p {
      color: #c5cee0;
      line-height: 1.6;
    }

    .email {
      margin: 25px 0;
      padding: 15px;
      background: #202d47;
      border-radius: 10px;
      overflow-wrap: anywhere;
    }

    .button {
      display: block;
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border: none;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }

    .gmail {
      background: #1688e8;
      color: white;
    }

    .copy {
      background: #263754;
      color: white;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      color: #55c7ff;
      text-decoration: none;
    }

    #message {
      color: #83e6a5;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Contact Us</h1>

    <p>
      Have a question or need support?
      Contact Playtech Studio. We are happy to help.
    </p>

    <div class="email">
      contactplaytechstudio@gmail.com
    </div>

    <a
      class="button gmail"
      href="https://mail.google.com/mail/?view=cm&fs=1&to=contactplaytechstudio%40gmail.com"
      target="_blank"
      rel="noopener noreferrer">
      Open Gmail
    </a>

    <button class="button copy" onclick="copyEmail()">
      Copy Email Address
    </button>

    <p id="message" aria-live="polite"></p>

    <a class="back" href="index.html">
      ← Back to Sketch Art AI
    </a>
  </main>

  <script>
    async function copyEmail() {
      const email = "contactplaytechstudio@gmail.com";
      const message = document.getElementById("message");

      try {
        await navigator.clipboard.writeText(email);
        message.textContent = "Email copied successfully!";
      } catch (error) {
        message.textContent = "Please copy manually: " + email;
      }
    }
  </script>
</body>
</html>
